---
server:
  port: 8000
  read_timeout: 30
  write_timeout: 1800
  pprof_port: 8001
  pprof_enabled: true
common:
  tokens_file: tokens.json
models:
  - name: deepseek-chat
    max_context_tokens: 128000
    max_output_tokens: 64000
    otps: 50
    ttft:
      min: 500
      max: 1000
  - name: deepseek-reasoner
    max_context_tokens: 128000
    max_output_tokens: 8192
    otps: 60
    ttft:
      min: 500
      max: 2000
  - name: qwen2.5-coder-14b
    max_context_tokens: 8192
    max_output_tokens: 8192
    otps: 80
    ttft:
      min: 500
      max: 1500
